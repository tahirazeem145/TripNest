# ================================================================
# TripNest Spring Boot — Application Properties
# ================================================================
# Sensitive values are loaded from backend/.env at startup
# via TripNestApplication.loadDotEnv()
# ================================================================

# Application name
spring.application.name=TripNest Backend

# ----------------------------------------------------------------
# Server
# ----------------------------------------------------------------
server.port=8080

# ----------------------------------------------------------------
# DataSource — PostgreSQL (Supabase)
# Phase 2: Database connection enabled.
# Credentials are loaded from backend/.env
# ----------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool — tuned for Supabase (cloud PostgreSQL)
# Keep pool small to avoid exhausting Supabase connection limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ----------------------------------------------------------------
# JPA / Hibernate
# Phase 2: ddl-auto=validate — Hibernate reads the existing schema
# and validates entities. It will NEVER create, alter, or drop tables.
# ----------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ----------------------------------------------------------------
# Supabase — external service config (for future phases)
# ----------------------------------------------------------------
supabase.url=${SUPABASE_URL:https://tfjhxhqmggaewbbmzjcv.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# ----------------------------------------------------------------
# Logging
# ----------------------------------------------------------------
logging.level.com.tripnest=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ----------------------------------------------------------------
# OpenAPI / Swagger UI
# ----------------------------------------------------------------
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
