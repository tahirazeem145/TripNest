# ================================================================
# TripNest Spring Boot — Application Properties
# ================================================================
# Sensitive values are loaded from backend/.env at startup
# via TripNestApplication.loadDotEnv()
# ================================================================

# Application name
spring.application.name=TripNest Backend

# ----------------------------------------------------------------
# Server
# ----------------------------------------------------------------
server.port=8080

# ----------------------------------------------------------------
# DataSource — PostgreSQL (Supabase)
# ----------------------------------------------------------------
# Phase 1: DB is disabled (JPA auto-config excluded below).
# Uncomment and fill in DB_PASSWORD in backend/.env for Phase 2.
#
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
#
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=false
# spring.jpa.open-in-view=false

# ----------------------------------------------------------------
# Phase 1: Exclude JPA + DataSource auto-configuration
# Remove these lines when enabling the DB in Phase 2.
# ----------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# ----------------------------------------------------------------
# Supabase — external service config (for future phases)
# ----------------------------------------------------------------
supabase.url=${SUPABASE_URL:https://tfjhxhqmggaewbbmzjcv.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# ----------------------------------------------------------------
# Logging
# ----------------------------------------------------------------
logging.level.com.tripnest=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ----------------------------------------------------------------
# OpenAPI / Swagger UI
# ----------------------------------------------------------------
springdoc.api-docs.path=/api/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
